!артилерия
block.sbc-squall.name = Шквал
block.sbc-squall.description = Высокоточная спаренная артилерия.

!лазерные турели
block.sbc-laser-astra.name = Астра
block.sbc-laser-astra.description = Стреляет лазерными импульсами.
block.sbc-laser-byran.name = Буран
block.sbc-laser-byran.description = Стреляет мощными лазерными импульсами.
block.sbc-laser-vortex.name = Вихрь
block.sbc-laser-vortex.description = Стреляет мощными очередями лазерных импульсов.

!РЛС
block.sbc-rls-1.name = Каста
block.sbc-rls-1.description = Маловысотная РЛС для обнаружения целей в том числе методом обхода рельефа.
block.sbc-rls-2.name = Терек
block.sbc-rls-2.description = Модернизируемый двухкоординатный радар метрового диапазона для обнаружения целей в условиях радиопомех.
block.sbc-rls-3.name = Заря
block.sbc-rls-3.description = Загоризонтные радар поверхностной и пространственной волны, использующие отражение сигнала от ионосферы для обнаружения целей за линией радиогоризонта.

!енергия
block.sbc-oil-generator-1.name = Нефтяной генератор
block.sbc-oil-generator-1.description = Использует нефть для генерации энергии. Имеет сносное КПД.
block.sbc-oil-generator-2.name = Улучшеный нефтяной генератор
block.sbc-oil-generator-2.description = Использует больше нефти для генерации энергии. Имеет одекватное КПД.
block.sbc-oil-generator-3.name = Продвинутый нефтяной генератор
block.sbc-oil-generator-3.description = Использует огромное количество нефти для генерации энергии. Имеет отличное КПД.
block.sbc-advanced-generator.name = Продвинутый ГВС
block.sbc-advanced-generator.description = Продвинутый генератор внутреннего сгорания. Использует нефть для увеличения КПД.

!ефекты
block.sbc-force-dome.name = Силовой купол
block.sbc-force-dome.description = Создает вокруг себя восьмиуголное силовое поле, защищая здания и боевые единицы внутри от повреждений.\nПерегревается, если нанесено слишком большое количество повреждений. Опционально использует охлаждающую жидкость для предотвращения перегрева. Фазовая ткань увеличивает размер и прочность щита.

