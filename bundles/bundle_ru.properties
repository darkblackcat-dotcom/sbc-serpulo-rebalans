!енергия
block.sbc-oil-generator-1.name = Нефтяной генератор
block.sbc-oil-generator-1.description = Использует нефть для генерации энергии. Имеет сносное КПД.
block.sbc-oil-generator-2.name = Улучшеный нефтяной генератор
