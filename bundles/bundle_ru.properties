block.sbc-advanced-generator.name = Продвинутый ГВС
block.sbc-advanced-generator.description = Продвинутый генератор внутреннего сгорания. Использует нефть для увеличения КПД.
!ефекты
block.sbc-force-dome.name = Силовой купол
block.sbc-force-dome.description = Создает вокруг себя восьмиуголное силовое поле, защищая здания и боевые единицы внутри от повреждений.\nПерегревается, если нанесено слишком большое количество повреждений. Опционально использует охлаждающую жидкость для предотвращения перегрева. Фазовая ткань увеличивает размер и прочность щита.
